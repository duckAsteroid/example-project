import static com.github.duckasteroid.git.Git.*
import com.github.duckasteroid.git.*

plugins {
  id 'application'
 }

dependencies {
  implementation project(':api')
  runtimeOnly project(':emitter')
  runtimeOnly project(':receiver')
}

application {
  mainClass = 'com.github.duckasteroid.Main'
}


task testGitCommand {
  doLast {
    println gitCommitID(false)
  }
}


// ALL PROJECTS
allprojects {
  apply plugin: 'java'
  apply plugin:  'maven-publish'

  group = 'com.github.duckasteroid'

  version = gitVersion(project)

  tasks.register('printVersion', PrintVersionTask) {
    group = 'versioning'
    version = project.version
  }

  repositories {
    mavenCentral()
  }

  dependencies {
    // Other dependencies...

    // JUnit Jupiter API and test implementation
    testImplementation libs.junit.api

    // JUnit Jupiter Engine
    testRuntimeOnly libs.junit.engine
  }


  test {
    useJUnitPlatform()
  }
  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        pom {
          name = project.name
          //description = "Project ${getProject().path}"
          url = "https://duckasteroid.github.io/${rootProject.name}/"
          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          scm {
            connection = "scm:git:git://github.com/duckAsteroid/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://github.com:duckAsteroid/${rootProject.name}.git"
            url ="https://github.com/duckAsteroid/${rootProject.name}/tree/master"
          }
          developers {
            developer {
              id = 'duckAsteroid'
              name = 'Chris Senior'
              email ='christopher.senior@gmail.com'
            }
          }
        }
      }
    }
    // add GitHub packages repo
    repositories {
      maven {
        name = "GitHubPackages"
        url = "https://maven.pkg.github.com/cognitranlimited/products-gradle-plugins"
        credentials {
          username = System.getenv("GITHUB_ACTOR")
          password = System.getenv("GITHUB_TOKEN")
        }
      }
      maven {
        name = 'LocalTest'
        // Change the URL to your desired local directory
        url = uri("${rootProject.buildDir}/repo")
      }
    }
  }
}




