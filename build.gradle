
plugins {
  id 'application'
  id 'pl.allegro.tech.build.axion-release' version '1.18.18' apply false
}

dependencies {
  implementation project(':api')
  runtimeOnly project(':emitter')
  runtimeOnly project(':receiver')
}

application {
  mainClass = 'com.github.duckasteroid.Main'
}

// ALL PROJECTS
allprojects {
  apply plugin: 'java'
  apply plugin: 'maven-publish'
  apply plugin: 'pl.allegro.tech.build.axion-release'

  group = 'com.github.duckasteroid'

  scmVersion {
    tag {
      // define a custom prefix for this project based on Gradle path
      def customPrefix = "${project.path.replace(':','/')}/v"
      while (customPrefix.startsWith("/")) {
        customPrefix = customPrefix.substring(1)
      }
      // Expect this prefix for this project
      prefix.set(customPrefix)
      // Fallback onto root project versions
      //fallbackPrefixes.set(['v'])
      // Absolute default is 0.0.0
      initialVersion({config, position -> "0.0.0+notag"})
    }
  }

  version = scmVersion.version

  repositories {
    mavenCentral()
  }

  dependencies {
    // Other dependencies...

    // JUnit Jupiter API and test implementation
    testImplementation libs.junit.api

    // JUnit Jupiter Engine
    testRuntimeOnly libs.junit.engine
  }


  test {
    useJUnitPlatform()
  }


  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        pom {
          name = project.name
          //description = "Project ${getProject().path}"
          url = "https://duckasteroid.github.io/${rootProject.name}/"
          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          scm {
            connection = "scm:git:git://github.com/duckAsteroid/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://github.com:duckAsteroid/${rootProject.name}.git"
            url ="https://github.com/duckAsteroid/${rootProject.name}/tree/master"
          }
          developers {
            developer {
              id = 'duckAsteroid'
              name = 'Chris Senior'
              email ='christopher.senior@gmail.com'
            }
          }
        }
      }
    }
    // add GitHub packages repo
    repositories {
      maven {
        name = "GitHubPackages"
        url = "https://maven.pkg.github.com/cognitranlimited/products-gradle-plugins"
        credentials {
          username = System.getenv("GITHUB_ACTOR")
          password = System.getenv("GITHUB_TOKEN")
        }
      }
      maven {
        name = 'LocalTest'
        // Change the URL to your desired local directory
        url = uri("${rootProject.buildDir}/repo")
      }
    }
  }
}




