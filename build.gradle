plugins {
  id 'application'
  id 'com.palantir.git-version' version '3.1.0'
 }

dependencies {
  implementation project(':api')
  runtimeOnly project(':emitter')
  runtimeOnly project(':receiver')
}


application {
  mainClass = 'com.github.duckasteroid.Main'
}

def getOurVersion(Project project) {
  def prefix = project.path.substring(1)
  def details = prefix.length() > 0 ? versionDetails(prefix: "/${prefix}/") : versionDetails()
  // get rid of leading 'v' (if there is one)
  def version = details.lastTag.startsWith('v') ? details.lastTag.substring(1) : details.lastTag
  // if we are on develop branch: auto increment last version segment
  if (details.branchName == "develop") {
    version = incrementLastVersionSegment(version)
  }
  // suffix is influenced by how clean the repo is
  def suffix = details.isCleanTag ? "" : "-SNAPSHOT"
  def result = "${version}${suffix}"
  println project.path + "="+ result
  return result
}

private String incrementLastVersionSegment(String version) {
  def parts = version.tokenize('.')
  if (parts.last().isInteger()) {
    parts[-1] = (parts.last() as Integer) + 1
  }
  return parts.join('.')
}


// ALL PROJECTS
allprojects {
  apply plugin: 'java'
  apply plugin:  'maven-publish'

  group = 'com.github.duckasteroid'

  version = getOurVersion(project)

  repositories {
    mavenCentral()
  }

  dependencies {
    // Other dependencies...

    // JUnit Jupiter API and test implementation
    testImplementation libs.junit.api

    // JUnit Jupiter Engine
    testRuntimeOnly libs.junit.engine
  }


  test {
    useJUnitPlatform()
  }
  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        pom {
          name = project.name
          //description = "Project ${getProject().path}"
          url = "http://duckasteroid.github.io/${rootProject.name}/"
          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          scm {
            connection = "scm:git:git://github.com/duckAsteroid/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://github.com:duckAsteroid/${rootProject.name}.git"
            url ="https://github.com/duckAsteroid/${rootProject.name}/tree/master"
          }
          developers {
            developer {
              id = 'duckAsteroid'
              name = 'Chris Senior'
              email ='christopher.senior@gmail.com'
            }
          }
        }
      }
    }
    // add GitHub packages repo
    repositories {
      maven {
        name = "GitHubPackages"
        url = "https://maven.pkg.github.com/cognitranlimited/products-gradle-plugins"
        credentials {
          username = System.getenv("GITHUB_ACTOR")
          password = System.getenv("GITHUB_TOKEN")
        }
      }
      maven {
        name = 'LocalTest'
        // Change the URL to your desired local directory
        url = uri("file://${rootProject.buildDir}/repo")
      }
    }
  }
}




